# Juniper SRX, native (non-OpenConfig) sensors.  Junos needs a few things
# that differ from the OpenConfig defaults above:
#
#   Encoding=proto    Junos documents PROTO as the only encoding it accepts
#                     for gNMI Subscribe.  It advertises JSON_IETF in its
#                     Capabilities response but has been reported to reject
#                     it on Subscribe, so start with proto.  Values arrive as
#                     typed scalars, which this ingester handles natively.
#
#   Suppress-Redundant must stay unset.  Junos rejects a SubscribeRequest
#                     that carries suppress_redundant at all.
#
#   Host port         Juniper examples use 9339 or 32767 rather than the
#                     57400 assumed by default; it is whatever you set with
#                     "set system services extension-service request-response
#                     grpc".
#
# The flow sensor was renamed in Junos 24.2R1, from .../flow/usage to
# .../flow/statistics.  Use the /usage form on releases before 24.2R1.
# These flow sensors are SRX5400/5600/5800.
#[Target "srx-fw1"]
#	Tag-Name=junos
#	Host=10.0.0.20:9339
#	Username=admin
#	Password=secret
#	Subscribe-Path=/junos/security/spu/flow/statistics/session
#	Encoding=proto
#	Stream-Mode=sample
#	Sample-Interval=30s

# Keepalive and message size, the two settings most likely to need changing:
#
#   Keepalive-Interval  gRPC servers refuse pings that arrive faster than they
#                       allow and hang up with ENHANCE_YOUR_CALM after a few
#                       violations, and the violation count only clears when
#                       the device sends data.  A quiet ON_CHANGE subscription
#                       is therefore the one that gets dropped.  The 6m default
#                       clears the 5m floor that grpc based servers use.  Lower
#                       it only if the device is known to permit faster pings.
#
#   Max-Message-Size    gRPC accepts 4MB messages by default, which a ONCE dump
#                       or a wide JSON_IETF subtree will exceed on a large
#                       chassis.  Raised to 16MB here.  If a target keeps
#                       failing with ResourceExhausted, raise it further; the
#                       failure repeats on every reconnect rather than clearing
#                       on its own.
