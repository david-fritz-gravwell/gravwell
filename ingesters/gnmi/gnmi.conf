[Global]
Ingest-Secret = IngestSecrets
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/opt/gravwell/comms/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/gnmi.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/opt/gravwell/log/gnmi.log

# The gNMI ingester dials OUT to network devices and holds a long lived
# Subscribe stream, so each target is a device we collect from.
#
# Credentials are sent as per-RPC gRPC metadata.  Use-TLS defaults to true for
# that reason; setting it to false puts the username and password on the wire
# in cleartext and the ingester will warn loudly at startup.

[Target "core-sw1"]
	Tag-Name=gnmi
	Host=10.0.0.5:57400            #port defaults to 57400 when not given
	Username=admin
	Password=secret
	Use-TLS=true                   #default, set false only on a trusted network
	Insecure-Skip-TLS-Verify=false #true to accept a self signed device cert
	#CA-Cert=/opt/gravwell/etc/device-ca.pem  #pin a private CA instead
	#Server-Name=core-sw1.example.com         #override the TLS SNI/verify name

	#Subscribe-Path is repeatable, one subscription per entry
	Subscribe-Path=/interfaces/interface/state/counters
	Subscribe-Path=/system/memory/state

	Mode=stream                    #stream, once, or poll
	Stream-Mode=sample             #sample, on-change, or target-defined
	Sample-Interval=10s            #how often the device samples in sample mode
	#Heartbeat-Interval=60s        #force an update even when nothing changed
	#Suppress-Redundant=true       #skip samples whose value did not change
	#Updates-Only=false            #true to skip the initial state dump
	#Origin=openconfig             #applied to paths that carry no origin
	Encoding=json_ietf             #json_ietf, json, proto, bytes, or ascii

	#Keepalive-Interval=6m         #how often to ping an idle connection, 0 disables
	#Keepalive-Timeout=20s         #how long to wait for the ping response
	#Max-Message-Size=16           #largest gRPC message to accept, in MB

# A second device, subscribing on-change rather than on a timer and talking
# to a device that presents a self signed certificate.
