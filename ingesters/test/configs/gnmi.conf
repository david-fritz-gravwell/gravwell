[Global]
Ingest-Secret = IngestSecrets
Connection-Timeout = 0
Insecure-Skip-TLS-Verify=false
#Cleartext-Backend-Target=127.0.0.1:4023 #example of adding a cleartext connection
#Cleartext-Backend-Target=127.1.0.1:4023 #example of adding another cleartext connection
#Encrypted-Backend-Target=127.1.1.1:4024 #example of adding an encrypted connection
Pipe-Backend-Target=/tmp/pipe #a named pipe connection, this should be used when ingester is on the same machine as a backend
#Ingest-Cache-Path=/opt/gravwell/cache/gnmi.cache #adding an ingest cache for local storage when uplinks fail
#Max-Ingest-Cache=1024 #Number of MB to store, localcache will only store 1GB before stopping.  This is a safety net
Log-Level=INFO
Log-File=/tmp/gnmi.log

[Target "core-sw1"]
	Tag-Name=gnmi
	Host=10.0.0.5:57400
	Username=admin
	Password=secret
	Use-TLS=true
	Subscribe-Path=/interfaces/interface/state/counters
	Subscribe-Path=/system/memory/state
	Mode=stream
	Stream-Mode=sample
	Sample-Interval=10s
	Encoding=json_ietf

[Target "edge-rtr1"]
	Tag-Name=gnmi3
	Host=10.0.0.9
	Username=admin
	Password=secret
	Insecure-Skip-TLS-Verify=true
	Subscribe-Path=/interfaces/interface[name=Ethernet1]/state/oper-status
	Stream-Mode=on-change
	Heartbeat-Interval=300s

[Target "srx-fw1"]
	Tag-Name=junos
	Host=10.0.0.20:9339
	Username=admin
	Password=secret
	Subscribe-Path=/junos/security/spu/flow/statistics/session
	Encoding=proto
	Stream-Mode=sample
	Sample-Interval=30s
